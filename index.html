<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rose Galaxy — For You ❤️</title>
    <style>
        /* ── reset & fullscreen ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #05030f;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ── overlay text ── */
        .overlay {
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 80, 150, 0.5), 0 0 80px rgba(200, 50, 120, 0.3);
            opacity: 0;
            animation: fadeInText 4s ease forwards 3s;
            padding: 1.5rem;
        }
        .overlay h1 {
            font-size: clamp(2.4rem, 10vw, 5.6rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #ffb3d9, #ff6b9d, #ff2d6a, #ffb3d9);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 6s ease-in-out infinite alternate;
            margin-bottom: 0.2em;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .overlay h2 {
            font-size: clamp(1rem, 3vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            color: rgba(255, 220, 240, 0.85);
            text-shadow: 0 0 30px rgba(255, 100, 180, 0.4);
            margin-top: 0.2em;
            font-style: italic;
        }
        .overlay .heart-symbol {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-top: 0.5em;
            display: inline-block;
            animation: pulseHeart 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 50, 100, 0.8));
        }
        .overlay .sub-message {
            font-size: clamp(0.8rem, 1.6vw, 1.2rem);
            color: rgba(255, 200, 230, 0.6);
            letter-spacing: 0.15em;
            margin-top: 1.2em;
            font-style: italic;
            font-weight: 300;
            max-width: 600px;
            line-height: 1.6;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        @keyframes pulseHeart {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }

        /* ── subtle vignette ── */
        .vignette {
            position: fixed;
            z-index: 2;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(5, 3, 15, 0.55) 100%);
        }

        /* ── tiny responsive tweaks ── */
        @media (max-width: 600px) {
            .overlay h1 {
                letter-spacing: 0.02em;
            }
            .overlay h2 {
                letter-spacing: 0.12em;
            }
        }
    </style>
</head>
<body>

    <!-- canvas -->
    <canvas id="canvas"></canvas>

    <!-- vignette overlay -->
    <div class="vignette"></div>

    <!-- text overlay -->
    <div class="overlay">
        <h1>For You, My Love</h1>
        <h2>✦ A Rose-Shaped Galaxy ✦</h2>
        <div class="heart-symbol">❤️</div>
        <div class="sub-message">
            Every star in this sky burns with a whisper of your name.<br>
            This universe was made from the light in your eyes.
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ROSE GALAXY  –  For Her
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H, centerX, centerY;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            centerX = W / 2;
            centerY = H / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // ─── utilities ───
        const rand = (a, b) => Math.random() * (b - a) + a;
        const lerp = (a, b, t) => a + (b - a) * t;
        const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

        // ─── mouse ───
        let mouseX = 0,
            mouseY = 0;
        let targetMouseX = 0,
            targetMouseY = 0;
        window.addEventListener('mousemove', e => {
            targetMouseX = (e.clientX / W - 0.5) * 2;
            targetMouseY = (e.clientY / H - 0.5) * 2;
        });
        window.addEventListener('touchmove', e => {
            const t = e.touches[0];
            targetMouseX = (t.clientX / W - 0.5) * 2;
            targetMouseY = (t.clientY / H - 0.5) * 2;
        }, { passive: true });

        // ─── stars (background) ───
        const STAR_COUNT = 380;
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: rand(0, W),
                y: rand(0, H),
                r: rand(0.3, 1.8),
                baseBright: rand(0.3, 1),
                speed: rand(0.008, 0.035),
                phase: rand(0, Math.PI * 2),
                color: `hsl(${rand(200, 280)}, ${rand(30, 70)}%, ${rand(70, 100)}%)`
            });
        }

        // ─── rose galaxy particles ───
        const PARTICLE_COUNT = 5200;
        const particles = [];
        const ROSE_PETALS = 5;
        const GALAXY_RADIUS = Math.min(W, H) * 0.38;
        const SPIRAL_TWIST = 2.8;

        // color palette: gold → pink → rose → deep purple
        function galaxyColor(t) {
            // t: 0 (center) → 1 (edge)
            const r = lerp(255, 180, t);
            const g = lerp(200, 50, t * t);
            const b = lerp(80, 200, t * t);
            const a = lerp(0.95, 0.4, t);
            return `rgba(${r|0}, ${g|0}, ${b|0}, ${a})`;
        }

        function galaxyColorGlow(t) {
            const r = lerp(255, 200, t);
            const g = lerp(180, 30, t * t);
            const b = lerp(60, 220, t * t);
            return `rgba(${r|0}, ${g|0}, ${b|0}, 0.25)`;
        }

        // Build particles
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // choose a petal
            const petal = Math.floor(rand(0, ROSE_PETALS));
            const petalAngle = (petal / ROSE_PETALS) * Math.PI * 2;

            // position along petal: 0=center, 1=tip
            const pos = Math.pow(rand(0.02, 1), 0.7);
            const angleOffset = rand(-0.35, 0.35) * (1 - pos * 0.5);
            const theta = petalAngle + angleOffset + pos * (Math.PI * 2 / ROSE_PETALS) * 0.6;

            // rose curve: r = R * cos(k * theta / 2)  (with spiral twist)
            const roseR = Math.cos(ROSE_PETALS * theta / 2);
            const radial = Math.abs(roseR) * pos * GALAXY_RADIUS * 0.85;

            // add some spiral distortion
            const spiralOffset = pos * SPIRAL_TWIST * 0.3;
            const finalTheta = theta + spiralOffset;

            const x = centerX + radial * Math.cos(finalTheta) + rand(-1.2, 1.2) * (1 + pos * 2);
            const y = centerY + radial * Math.sin(finalTheta) + rand(-1.2, 1.2) * (1 + pos * 2);

            // size: smaller near edges, larger near center
            const size = lerp(rand(1.8, 4.5), rand(0.4, 1.8), pos);

            // color
            const colorT = pos;
            const color = galaxyColor(colorT);

            // glow color
            const glow = galaxyColorGlow(colorT);

            // rotation speed (slightly different per particle)
            const rotSpeed = rand(0.0004, 0.0012) * (1 - pos * 0.5);

            // phase offset for twinkling
            const phase = rand(0, Math.PI * 2);

            particles.push({
                x,
                y,
                baseX: x,
                baseY: y,
                radial,
                theta: finalTheta,
                pos,
                size,
                color,
                glow,
                rotSpeed,
                phase,
                petal,
                angleOffset,
                // for drifting
                driftX: rand(-0.3, 0.3),
                driftY: rand(-0.3, 0.3),
                driftSpeed: rand(0.0003, 0.001),
                driftPhase: rand(0, Math.PI * 2)
            });
        }

        // ─── hearts ───
        const HEART_COUNT = 45;
        const hearts = [];
        for (let i = 0; i < HEART_COUNT; i++) {
            hearts.push({
                x: rand(0, W),
                y: rand(0, H),
                size: rand(8, 28),
                speedY: rand(0.2, 0.9),
                sway: rand(0.3, 1.2),
                phase: rand(0, Math.PI * 2),
                opacity: rand(0.2, 0.8),
                pulseSpeed: rand(0.015, 0.04),
                pulsePhase: rand(0, Math.PI * 2),
                color: `hsla(${rand(330, 360)}, 90%, ${rand(55, 80)}%, `
            });
        }

        // ─── shooting stars ───
        let shootingStars = [];

        function spawnShootingStar() {
            const angle = rand(-Math.PI * 0.4, -Math.PI * 0.15);
            const speed = rand(6, 18);
            const length = rand(80, 250);
            const x = rand(0, W * 0.6);
            const y = rand(0, H * 0.4);
            shootingStars.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                length,
                life: 1,
                decay: rand(0.005, 0.018),
                width: rand(1.5, 4)
            });
        }

        // spawn a few initially
        for (let i = 0; i < 3; i++) {
            setTimeout(() => spawnShootingStar(), i * 1200 + 500);
        }
        setInterval(spawnShootingStar, rand(4000, 9000));

        // ─── animation loop ───
        let time = 0;
        let frame = 0;

        function draw() {
            frame++;
            time += 0.005;

            // smooth mouse
            mouseX += (targetMouseX - mouseX) * 0.04;
            mouseY += (targetMouseY - mouseY) * 0.04;

            // ── clear ──
            ctx.clearRect(0, 0, W, H);

            // ── deep space background ──
            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(W, H) * 0.9);
            grad.addColorStop(0, '#12081f');
            grad.addColorStop(0.35, '#0c0818');
            grad.addColorStop(0.7, '#070410');
            grad.addColorStop(1, '#03020a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // ── background nebula glow ──
            const nebX = centerX + Math.sin(time * 0.015) * 120;
            const nebY = centerY + Math.cos(time * 0.02) * 80;
            const nebGrad = ctx.createRadialGradient(nebX, nebY, 0, nebX, nebY, 400);
            nebGrad.addColorStop(0, 'rgba(120, 20, 80, 0.06)');
            nebGrad.addColorStop(0.5, 'rgba(60, 10, 100, 0.05)');
            nebGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = nebGrad;
            ctx.fillRect(0, 0, W, H);

            const nebX2 = centerX - Math.sin(time * 0.02 + 1) * 200;
            const nebY2 = centerY + Math.cos(time * 0.018 + 0.5) * 150;
            const nebGrad2 = ctx.createRadialGradient(nebX2, nebY2, 0, nebX2, nebY2, 350);
            nebGrad2.addColorStop(0, 'rgba(80, 20, 140, 0.05)');
            nebGrad2.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = nebGrad2;
            ctx.fillRect(0, 0, W, H);

            // ── background stars (twinkling) ──
            for (const s of stars) {
                const bright = s.baseBright * (0.6 + 0.4 * Math.sin(time * s.speed * 15 + s.phase));
                const alpha = bright * 0.9;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r * (0.7 + 0.3 * Math.sin(time * s.speed * 12 + s.phase + 1)), 0, Math.PI * 2);
                ctx.fillStyle = s.color.replace(')', `, ${alpha})`).replace('hsl', 'hsla');
                ctx.fill();

                // occasional glint on larger stars
                if (s.r > 1.2 && bright > 0.7) {
                    const glint = (bright - 0.7) / 0.3 * 0.3;
                    ctx.shadowColor = 'rgba(255,255,255,0.2)';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${glint * 0.15})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ── rose galaxy ──
            const galaxyAngle = time * 0.06;
            const tiltX = mouseX * 0.06;
            const tiltY = mouseY * 0.04;

            // sort particles by size for proper layering (bigger in back)
            const sorted = [...particles].sort((a, b) => a.size - b.size);

            // first pass: glow
            for (const p of sorted) {
                const angleOff = p.theta + galaxyAngle * p.rotSpeed * 180;
                const rOff = p.radial * (1 + Math.sin(time * p.driftSpeed * 20 + p.driftPhase) * 0.012);

                const cx = p.baseX + Math.sin(time * p.driftSpeed * 12 + p.driftPhase) * p.driftX * 1.2;
                const cy = p.baseY + Math.cos(time * p.driftSpeed * 14 + p.driftPhase + 0.5) * p.driftY * 1.2;

                // apply galaxy rotation
                const cosA = Math.cos(galaxyAngle * p.rotSpeed * 120 + tiltX * 0.3);
                const sinA = Math.sin(galaxyAngle * p.rotSpeed * 120 + tiltX * 0.3);
                const dx = cx - centerX;
                const dy = cy - centerY;
                const rx = dx * cosA - dy * sinA;
                const ry = dx * sinA + dy * cosA;
                const fx = centerX + rx + tiltY * 0.2 * (p.pos * 30);
                const fy = centerY + ry + tiltX * 0.2 * (p.pos * 30);

                // glow
                const glowSize = p.size * 5 + 6;
                const alpha = 0.08 + 0.08 * Math.sin(time * 0.03 + p.phase);
                ctx.beginPath();
                ctx.arc(fx, fy, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = p.glow.replace('0.25', alpha);
                ctx.fill();
            }

            // second pass: particles
            for (const p of sorted) {
                const angleOff = p.theta + galaxyAngle * p.rotSpeed * 180;
                const rOff = p.radial * (1 + Math.sin(time * p.driftSpeed * 20 + p.driftPhase) * 0.012);

                const cx = p.baseX + Math.sin(time * p.driftSpeed * 12 + p.driftPhase) * p.driftX * 1.2;
                const cy = p.baseY + Math.cos(time * p.driftSpeed * 14 + p.driftPhase + 0.5) * p.driftY * 1.2;

                // apply galaxy rotation
                const cosA = Math.cos(galaxyAngle * p.rotSpeed * 120 + tiltX * 0.3);
                const sinA = Math.sin(galaxyAngle * p.rotSpeed * 120 + tiltX * 0.3);
                const dx = cx - centerX;
                const dy = cy - centerY;
                const rx = dx * cosA - dy * sinA;
                const ry = dx * sinA + dy * cosA;
                const fx = centerX + rx + tiltY * 0.2 * (p.pos * 30);
                const fy = centerY + ry + tiltX * 0.2 * (p.pos * 30);

                // twinkle
                const twinkle = 0.7 + 0.3 * Math.sin(time * 0.04 + p.phase + p.pos * 5);
                const size = p.size * (0.85 + 0.15 * Math.sin(time * 0.03 + p.phase * 0.5));

                // shadow for glow
                ctx.shadowColor = p.color;
                ctx.shadowBlur = size * 3 + 4;

                ctx.beginPath();
                ctx.arc(fx, fy, size * twinkle, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                // extra bright core for center particles
                if (p.pos < 0.3) {
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(fx, fy, size * 0.3 * twinkle, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 240, 200, ${0.4 + 0.3 * Math.sin(time * 0.05 + p.phase)})`;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            // ── galaxy center glow ──
            const centerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 80);
            centerGlow.addColorStop(0, 'rgba(255, 200, 150, 0.25)');
            centerGlow.addColorStop(0.3, 'rgba(255, 120, 180, 0.15)');
            centerGlow.addColorStop(1, 'rgba(200, 50, 150, 0)');
            ctx.fillStyle = centerGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
            ctx.fill();

            // ── floating hearts ──
            for (const h of hearts) {
                // drift upward with sway
                h.y -= h.speedY * 0.25;
                h.x += Math.sin(time * h.sway * 0.6 + h.phase) * 0.3;
                h.phase += 0.008;

                // reset if off screen
                if (h.y < -50) {
                    h.y = H + 30;
                    h.x = rand(0, W);
                    h.size = rand(8, 28);
                    h.speedY = rand(0.2, 0.9);
                    h.opacity = rand(0.2, 0.7);
                }

                const pulse = 1 + 0.15 * Math.sin(time * h.pulseSpeed * 20 + h.pulsePhase);
                const size = h.size * pulse;
                const alpha = h.opacity * (0.8 + 0.2 * Math.sin(time * 0.02 + h.phase));

                // glow
                ctx.shadowColor = `rgba(255, 50, 100, 0.3)`;
                ctx.shadowBlur = 20;

                // draw heart
                ctx.save();
                ctx.translate(h.x, h.y);
                const s = size / 20;
                ctx.scale(s, s);
                ctx.beginPath();
                ctx.moveTo(0, 5);
                ctx.bezierCurveTo(-10, -5, -18, 5, 0, 18);
                ctx.bezierCurveTo(18, 5, 10, -5, 0, 5);
                ctx.closePath();
                ctx.fillStyle = h.color + `${alpha})`;
                ctx.fill();

                // inner highlight
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(0, 7);
                ctx.bezierCurveTo(-4, 3, -8, 7, 0, 14);
                ctx.bezierCurveTo(8, 7, 4, 3, 0, 7);
                ctx.closePath();
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15})`;
                ctx.fill();

                ctx.restore();
                ctx.shadowBlur = 0;
            }

            // ── shooting stars ──
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= s.decay;
                s.vx *= 0.998;
                s.vy *= 0.998;

                if (s.life <= 0 || s.x > W + 50 || s.y > H + 50) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                const alpha = s.life * 0.9;
                const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 2.5, s.y - s.vy * 2.5);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                grad.addColorStop(0.4, `rgba(255, 220, 255, ${alpha * 0.6})`);
                grad.addColorStop(1, `rgba(255, 200, 255, 0)`);

                ctx.shadowColor = `rgba(255, 200, 255, ${alpha * 0.3})`;
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                const tailX = s.x - s.vx * 2.5;
                const tailY = s.y - s.vy * 2.5;
                ctx.lineTo(tailX, tailY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = s.width * s.life;
                ctx.lineCap = 'round';
                ctx.stroke();

                // bright head
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.width * s.life * 1.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // ── subtle light rays from galaxy center ──
            if (frame % 2 === 0) {
                for (let i = 0; i < 6; i++) {
                    const a = time * 0.02 + i * (Math.PI / 3);
                    const r1 = 120 + 20 * Math.sin(time * 0.04 + i);
                    const r2 = 180 + 30 * Math.sin(time * 0.035 + i + 1);
                    const x1 = centerX + Math.cos(a) * r1;
                    const y1 = centerY + Math.sin(a) * r1;
                    const x2 = centerX + Math.cos(a + 0.06) * r2;
                    const y2 = centerY + Math.sin(a + 0.06) * r2;
                    const grad2 = ctx.createLinearGradient(x1, y1, x2, y2);
                    grad2.addColorStop(0, `rgba(255, 150, 200, ${0.02 + 0.02 * Math.sin(time * 0.03 + i)})`);
                    grad2.addColorStop(1, 'rgba(255, 100, 180, 0)');
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = grad2;
                    ctx.lineWidth = 60;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
            }

            // ── center sparkle ──
            const sparkle = 0.5 + 0.5 * Math.sin(time * 0.07);
            ctx.shadowColor = `rgba(255, 180, 200, ${0.3 * sparkle})`;
            ctx.shadowBlur = 60;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 2 + sparkle * 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 240, 230, ${0.5 + 0.4 * sparkle})`;
            ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }

        draw();

        // ─── handle resize for particles ───
        window.addEventListener('resize', () => {
            resize();
            // reposition stars
            for (const s of stars) {
                s.x = rand(0, W);
                s.y = rand(0, H);
            }
            // reposition hearts
            for (const h of hearts) {
                h.x = rand(0, W);
                h.y = rand(0, H);
            }
        });

        // ─── small easter egg: click creates a burst of hearts ───
        canvas.addEventListener('click', (e) => {
            const cx = e.clientX;
            const cy = e.clientY;
            for (let i = 0; i < 16; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(2, 6);
                const h = {
                    x: cx,
                    y: cy,
                    size: rand(10, 26),
                    speedY: rand(0.3, 1.2),
                    sway: rand(0.5, 1.5),
                    phase: rand(0, Math.PI * 2),
                    opacity: rand(0.5, 0.9),
                    pulseSpeed: rand(0.02, 0.05),
                    pulsePhase: rand(0, Math.PI * 2),
                    color: `hsla(${rand(330, 360)}, 90%, ${rand(55, 80)}%, `
                };
                // give it velocity
                h.vx = Math.cos(angle) * speed;
                h.vy = Math.sin(angle) * speed - 1;
                hearts.push(h);
                // remove after a while
                setTimeout(() => {
                    const idx = hearts.indexOf(h);
                    if (idx > -1) hearts.splice(idx, 1);
                }, 6000);
            }
        });

        console.log('💫 Rose Galaxy — Made with love ❤️');
    </script>
</body>
</html>
