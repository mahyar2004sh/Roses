<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rose Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0618;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .vignette {
            position: fixed;
            z-index: 2;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(10, 6, 24, 0.6) 100%);
        }

        /* small hint – barely visible, but not text */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 5;
            pointer-events: none;
            color: rgba(255, 80, 80, 0.2);
            font-size: 12px;
            letter-spacing: 2px;
            font-family: sans-serif;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="vignette"></div>
    <!-- No text overlays -->

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ROSE-RED GALAXY  –  Pure visual love
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H, cx, cy;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            cx = W / 2;
            cy = H / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        const rand = (a, b) => Math.random() * (b - a) + a;
        const lerp = (a, b, t) => a + (b - a) * t;

        // ─── mouse / touch ───
        let mx = 0,
            my = 0;
        let tmx = 0,
            tmy = 0;
        window.addEventListener('mousemove', e => {
            tmx = (e.clientX / W - 0.5) * 2;
            tmy = (e.clientY / H - 0.5) * 2;
        });
        window.addEventListener('touchmove', e => {
            const t = e.touches[0];
            tmx = (t.clientX / W - 0.5) * 2;
            tmy = (t.clientY / H - 0.5) * 2;
        }, { passive: true });

        // ─── background stars (cool white/blue to contrast red) ───
        const STAR_COUNT = 450;
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: rand(0, W),
                y: rand(0, H),
                r: rand(0.2, 2.0),
                bright: rand(0.3, 1),
                speed: rand(0.006, 0.04),
                phase: rand(0, Math.PI * 2),
                hue: rand(210, 260),
                sat: rand(30, 70),
                lig: rand(70, 100)
            });
        }

        // ─── ROSE GALAXY – RED PALETTE ───
        const PETALS = 5;
        const ROSE_RADIUS = Math.min(W, H) * 0.35;
        const PARTICLE_COUNT = 8000;
        const SPIRAL_TWIST = 2.2;

        // Deep rose-red colors
        function roseColor(t, layer) {
            // t: 0 center, 1 edge
            // layer: 0 inner, 1 outer
            const r = lerp(255, lerp(200, 120, layer), t);
            const g = lerp(70, lerp(30, 10, layer), t * t);
            const b = lerp(70, lerp(30, 10, layer), t * t);
            const a = lerp(0.95, 0.25 + 0.2 * (1 - layer), t);
            return `rgba(${r|0}, ${g|0}, ${b|0}, ${a})`;
        }

        function roseGlow(t, layer) {
            const r = lerp(255, lerp(160, 80, layer), t);
            const g = lerp(50, lerp(20, 5, layer), t * t);
            const b = lerp(50, lerp(20, 5, layer), t * t);
            return `rgba(${r|0}, ${g|0}, ${b|0}, 0.15)`;
        }

        const particles = [];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const petal = Math.floor(rand(0, PETALS));
            const petalAngle = (petal / PETALS) * Math.PI * 2;
            const pos = Math.pow(rand(0.02, 1), 0.6);
            const spread = lerp(0.08, 0.45, pos);
            const angleOff = rand(-spread, spread);
            let theta = petalAngle + angleOff;
            const roseR = Math.cos(PETALS * theta / 2);
            const radial = Math.abs(roseR) * pos * ROSE_RADIUS * 0.9;
            const twist = pos * SPIRAL_TWIST * 0.4;
            theta += twist;
            const jitter = (1 + pos * 2) * 0.8;
            const x = cx + radial * Math.cos(theta) + rand(-jitter, jitter);
            const y = cy + radial * Math.sin(theta) + rand(-jitter, jitter);
            const layer = pos;
            const size = lerp(rand(1.5, 4.5), rand(0.3, 1.8), pos);
            const color = roseColor(pos, layer);
            const glow = roseGlow(pos, layer);
            const rotSpeed = rand(0.0002, 0.001) * (1 - pos * 0.6);
            const phase = rand(0, Math.PI * 2);
            const driftX = rand(-0.4, 0.4);
            const driftY = rand(-0.4, 0.4);
            const driftSpeed = rand(0.0002, 0.0012);

            particles.push({
                x,
                y,
                baseX: x,
                baseY: y,
                radial,
                theta,
                pos,
                size,
                color,
                glow,
                rotSpeed,
                phase,
                driftX,
                driftY,
                driftSpeed,
                driftPhase: rand(0, Math.PI * 2),
                layer
            });
        }

        // extra center glow (golden-red)
        const CENTER_COUNT = 400;
        for (let i = 0; i < CENTER_COUNT; i++) {
            const r = rand(0, ROSE_RADIUS * 0.15);
            const a = rand(0, Math.PI * 2);
            const x = cx + r * Math.cos(a);
            const y = cy + r * Math.sin(a);
            particles.push({
                x,
                y,
                baseX: x,
                baseY: y,
                radial: r,
                theta: a,
                pos: 0.02,
                size: rand(0.8, 2.5),
                color: `rgba(255, 180, 120, ${rand(0.3, 0.8)})`,
                glow: 'rgba(255, 150, 100, 0.2)',
                rotSpeed: rand(0.0005, 0.002),
                phase: rand(0, Math.PI * 2),
                driftX: rand(-0.1, 0.1),
                driftY: rand(-0.1, 0.1),
                driftSpeed: rand(0.0005, 0.0015),
                driftPhase: rand(0, Math.PI * 2),
                layer: 0,
                isCore: true
            });
        }

        // ─── floating hearts (rose-red) ───
        const HEART_COUNT = 55;
        const hearts = [];
        for (let i = 0; i < HEART_COUNT; i++) {
            hearts.push({
                x: rand(0, W),
                y: rand(0, H),
                size: rand(8, 32),
                speed: rand(0.15, 0.8),
                sway: rand(0.3, 1.4),
                phase: rand(0, Math.PI * 2),
                opacity: rand(0.15, 0.7),
                pulseSpeed: rand(0.012, 0.045),
                pulsePhase: rand(0, Math.PI * 2),
                hue: rand(340, 365),
                light: rand(50, 80)
            });
        }

        // ─── shooting stars (red-tinted) ───
        let shootingStars = [];

        function spawnShootingStar() {
            const angle = rand(-Math.PI * 0.45, -Math.PI * 0.1);
            const speed = rand(8, 22);
            const x = rand(0, W * 0.7);
            const y = rand(0, H * 0.35);
            shootingStars.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                length: rand(100, 300),
                life: 1,
                decay: rand(0.004, 0.02),
                width: rand(1.5, 4.5),
                hue: rand(340, 360)
            });
        }

        for (let i = 0; i < 4; i++) {
            setTimeout(spawnShootingStar, i * 1400 + 600);
        }
        setInterval(() => {
            if (Math.random() < 0.4) spawnShootingStar();
        }, rand(3000, 8000));

        // ─── click → heart burst ───
        canvas.addEventListener('click', (e) => {
            const cx2 = e.clientX;
            const cy2 = e.clientY;
            for (let i = 0; i < 24; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(2, 7);
                const h = {
                    x: cx2,
                    y: cy2,
                    size: rand(10, 30),
                    speed: rand(0.3, 1.4),
                    sway: rand(0.5, 1.8),
                    phase: rand(0, Math.PI * 2),
                    opacity: rand(0.4, 0.9),
                    pulseSpeed: rand(0.02, 0.06),
                    pulsePhase: rand(0, Math.PI * 2),
                    hue: rand(340, 365),
                    light: rand(50, 85),
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    burst: true
                };
                hearts.push(h);
                setTimeout(() => {
                    const idx = hearts.indexOf(h);
                    if (idx > -1) hearts.splice(idx, 1);
                }, 7000);
            }
        });

        // ─── animation loop ───
        let time = 0;

        function draw() {
            time += 0.006;

            mx += (tmx - mx) * 0.045;
            my += (tmy - my) * 0.045;

            // clear
            ctx.clearRect(0, 0, W, H);

            // deep space (dark red-black)
            const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.95);
            bg.addColorStop(0, '#1a0a10');
            bg.addColorStop(0.3, '#12060a');
            bg.addColorStop(0.65, '#0a0408');
            bg.addColorStop(1, '#040206');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // nebula glows (red)
            for (let n = 0; n < 3; n++) {
                const nx = cx + Math.sin(time * 0.012 + n * 2.1) * 180;
                const ny = cy + Math.cos(time * 0.015 + n * 1.7) * 120;
                const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, 320 + n * 80);
                const al = 0.04 + n * 0.015;
                ng.addColorStop(0, `rgba(160, 20, 40, ${al})`);
                ng.addColorStop(0.5, `rgba(100, 10, 30, ${al * 0.6})`);
                ng.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = ng;
                ctx.fillRect(0, 0, W, H);
            }

            // background stars
            for (const s of stars) {
                const b = s.bright * (0.6 + 0.4 * Math.sin(time * s.speed * 18 + s.phase));
                const a = b * 0.9;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r * (0.6 + 0.4 * Math.sin(time * s.speed * 14 + s.phase + 0.5)), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${s.hue}, ${s.sat}%, ${s.lig}%, ${a})`;
                ctx.fill();
                if (s.r > 1.4 && b > 0.7) {
                    ctx.shadowColor = `hsla(${s.hue}, 100%, 100%, ${(b - 0.7) * 0.2})`;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${(b - 0.7) * 0.08})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ── ROSE GALAXY ──
            const rot = time * 0.045;
            const tiltX = mx * 0.07;
            const tiltY = my * 0.05;

            const sorted = [...particles].sort((a, b) => a.size - b.size);

            // Glow pass
            for (const p of sorted) {
                const angleOff = p.theta + rot * p.rotSpeed * 200;
                const rOff = p.radial * (1 + Math.sin(time * p.driftSpeed * 25 + p.driftPhase) * 0.015);

                const cx2 = p.baseX + Math.sin(time * p.driftSpeed * 16 + p.driftPhase) * p.driftX * 1.5;
                const cy2 = p.baseY + Math.cos(time * p.driftSpeed * 18 + p.driftPhase + 0.7) * p.driftY * 1.5;

                const cosA = Math.cos(rot * p.rotSpeed * 150 + tiltX * 0.25);
                const sinA = Math.sin(rot * p.rotSpeed * 150 + tiltX * 0.25);
                const dx = cx2 - cx;
                const dy = cy2 - cy;
                const rx = dx * cosA - dy * sinA;
                const ry = dx * sinA + dy * cosA;
                const fx = cx + rx + tiltY * 0.15 * (p.pos * 40);
                const fy = cy + ry + tiltX * 0.15 * (p.pos * 40);

                const gs = p.size * 5 + 8;
                const al = 0.06 + 0.08 * Math.sin(time * 0.025 + p.phase);
                ctx.beginPath();
                ctx.arc(fx, fy, gs, 0, Math.PI * 2);
                ctx.fillStyle = p.glow || `rgba(200,50,50,${al})`;
                ctx.fill();
            }

            // Particle pass
            for (const p of sorted) {
                const angleOff = p.theta + rot * p.rotSpeed * 200;
                const rOff = p.radial * (1 + Math.sin(time * p.driftSpeed * 25 + p.driftPhase) * 0.015);

                const cx2 = p.baseX + Math.sin(time * p.driftSpeed * 16 + p.driftPhase) * p.driftX * 1.5;
                const cy2 = p.baseY + Math.cos(time * p.driftSpeed * 18 + p.driftPhase + 0.7) * p.driftY * 1.5;

                const cosA = Math.cos(rot * p.rotSpeed * 150 + tiltX * 0.25);
                const sinA = Math.sin(rot * p.rotSpeed * 150 + tiltX * 0.25);
                const dx = cx2 - cx;
                const dy = cy2 - cy;
                const rx = dx * cosA - dy * sinA;
                const ry = dx * sinA + dy * cosA;
                const fx = cx + rx + tiltY * 0.15 * (p.pos * 40);
                const fy = cy + ry + tiltX * 0.15 * (p.pos * 40);

                const twinkle = 0.7 + 0.3 * Math.sin(time * 0.035 + p.phase + p.pos * 6);
                const sz = p.size * (0.8 + 0.2 * Math.sin(time * 0.025 + p.phase * 0.7));

                ctx.shadowColor = p.color;
                ctx.shadowBlur = sz * 3 + 4;

                ctx.beginPath();
                ctx.arc(fx, fy, sz * twinkle, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                if (p.pos < 0.25 || p.isCore) {
                    ctx.shadowBlur = 0;
                    const coreAl = 0.3 + 0.3 * Math.sin(time * 0.04 + p.phase);
                    ctx.beginPath();
                    ctx.arc(fx, fy, sz * 0.3 * twinkle, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 180, 120, ${coreAl})`;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            // ── galaxy center glow (red-gold) ──
            const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
            cg.addColorStop(0, 'rgba(255, 120, 80, 0.35)');
            cg.addColorStop(0.3, 'rgba(200, 60, 40, 0.2)');
            cg.addColorStop(0.7, 'rgba(150, 30, 20, 0.08)');
            cg.addColorStop(1, 'rgba(80, 10, 10, 0)');
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.arc(cx, cy, 120, 0, Math.PI * 2);
            ctx.fill();

            // ── center sparkle ──
            const sp = 0.5 + 0.5 * Math.sin(time * 0.06);
            ctx.shadowColor = `rgba(255, 150, 120, ${0.4 * sp})`;
            ctx.shadowBlur = 80;
            ctx.beginPath();
            ctx.arc(cx, cy, 2 + sp * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 200, 180, ${0.6 + 0.4 * sp})`;
            ctx.fill();
            ctx.shadowBlur = 0;

            // ── light rays (red) ──
            for (let i = 0; i < 8; i++) {
                const a = time * 0.018 + i * (Math.PI / 4);
                const r1 = 80 + 15 * Math.sin(time * 0.03 + i * 1.2);
                const r2 = 150 + 25 * Math.sin(time * 0.025 + i * 1.5 + 0.7);
                const x1 = cx + Math.cos(a) * r1;
                const y1 = cy + Math.sin(a) * r1;
                const x2 = cx + Math.cos(a + 0.05) * r2;
                const y2 = cy + Math.sin(a + 0.05) * r2;
                const g2 = ctx.createLinearGradient(x1, y1, x2, y2);
                const al2 = 0.015 + 0.02 * Math.sin(time * 0.025 + i);
                g2.addColorStop(0, `rgba(200, 60, 60, ${al2})`);
                g2.addColorStop(1, 'rgba(150, 30, 30, 0)');
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = g2;
                ctx.lineWidth = 50 + 20 * Math.sin(time * 0.02 + i);
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            // ── floating hearts ──
            for (const h of hearts) {
                if (h.burst) {
                    h.x += h.vx || 0;
                    h.y += h.vy || 0;
                    h.vy = (h.vy || 0) + 0.02;
                    h.vx = (h.vx || 0) * 0.99;
                    h.phase += 0.03;
                    if (h.y > H + 50) { h.opacity = 0; }
                } else {
                    h.y -= h.speed * 0.2;
                    h.x += Math.sin(time * h.sway * 0.5 + h.phase) * 0.25;
                    h.phase += 0.01;
                    if (h.y < -60) {
                        h.y = H + 40;
                        h.x = rand(0, W);
                        h.size = rand(8, 32);
                        h.speed = rand(0.15, 0.8);
                        h.opacity = rand(0.15, 0.7);
                    }
                }

                const pulse = 1 + 0.18 * Math.sin(time * h.pulseSpeed * 18 + h.pulsePhase);
                const sz = h.size * pulse;
                const al = h.opacity * (0.8 + 0.2 * Math.sin(time * 0.02 + h.phase));

                if (al < 0.01) continue;

                ctx.shadowColor = `rgba(200, 30, 30, 0.25)`;
                ctx.shadowBlur = 25;

                ctx.save();
                ctx.translate(h.x, h.y);
                const sc = sz / 22;
                ctx.scale(sc, sc);

                ctx.beginPath();
                ctx.moveTo(0, 5);
                ctx.bezierCurveTo(-11, -6, -20, 6, 0, 20);
                ctx.bezierCurveTo(20, 6, 11, -6, 0, 5);
                ctx.closePath();
                ctx.fillStyle = `hsla(${h.hue || 345}, 90%, ${h.light || 65}%, ${al})`;
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(0, 7);
                ctx.bezierCurveTo(-5, 3, -10, 7, 0, 15);
                ctx.bezierCurveTo(10, 7, 5, 3, 0, 7);
                ctx.closePath();
                ctx.fillStyle = `rgba(255,255,255,${al * 0.12})`;
                ctx.fill();

                ctx.restore();
                ctx.shadowBlur = 0;
            }

            // ── shooting stars ──
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= s.decay;
                s.vx *= 0.998;
                s.vy *= 0.998;

                if (s.life <= 0 || s.x > W + 60 || s.y > H + 60) {
                    shootingStars.splice(i, 1);
                    continue;
                }

                const al = s.life * 0.9;
                const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 3, s.y - s.vy * 3);
                grad.addColorStop(0, `rgba(255, 200, 200, ${al})`);
                grad.addColorStop(0.3, `rgba(255, 150, 150, ${al * 0.6})`);
                grad.addColorStop(1, `rgba(200, 80, 80, 0)`);

                ctx.shadowColor = `rgba(200, 80, 80, ${al * 0.3})`;
                ctx.shadowBlur = 35;
                ctx.beginPath();
                const tx = s.x - s.vx * 3;
                const ty = s.y - s.vy * 3;
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tx, ty);
                ctx.strokeStyle = grad;
                ctx.lineWidth = s.width * s.life;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.shadowBlur = 50;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.width * s.life * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 220, ${al * 0.9})`;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(draw);
        }

        draw();

        // ─── resize ───
        window.addEventListener('resize', () => {
            resize();
            for (const s of stars) {
                s.x = rand(0, W);
                s.y = rand(0, H);
            }
            for (const h of hearts) {
                if (!h.burst) {
                    h.x = rand(0, W);
                    h.y = rand(0, H);
                }
            }
        });

        console.log('🌹 Rose-Red Galaxy — pure emotion');
    </script>
</body>
</html>
